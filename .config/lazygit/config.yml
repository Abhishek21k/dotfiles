gui:
  theme:
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    activeBorderColor:
      - "#ff9e64"
      - "bold"
    unstagedChangesColor:
      - "#db4b4b"
    selectedLineBgColor:
      - "#283457"
    searchingActiveBorderColor:
      - "#ff9e64"
      - "bold"
    optionsTextColor:
      - "#7aa2f7"
    inactiveBorderColor:
      - "#27a1b9"
    defaultFgColor:
      - "#c0caf5"
  nerdFontsVersion: "3"
os:
  editPreset: "nvim-remote"
customCommands:
  - key: "<c-l>"
    command: 'git log --graph --color=always --pretty=format:"%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset" --abbrev-commit --date=relative | head -n 100'
    context: "global"
    output: "popup"
    outputTitle: "Git Beautiful Log"

    description: "Beautiful log"
  - key: "W"
    context: "localBranches"
    description: "Create worktree from branch"
    command: 'git worktree add -b ''{{.Form.Branch}}'' "../.worktree/$(basename $(git rev-parse --show-toplevel))-{{.Form.Suffix}}" ''refs/heads/{{.SelectedLocalBranch.Name}}'' && WT="../.worktree/$(basename $(git rev-parse --show-toplevel))-{{.Form.Suffix}}" && find . -name ''.env.*'' | while read f; do mkdir -p "$WT/$(dirname $f)" && cp "$f" "$WT/$f"; done 2>/dev/null; true'
    prompts:
      - type: "input"
        title: "New branch name"
        key: "Branch"
      - type: "input"
        title: "Worktree suffix (for ../.worktree/<repo>-___)"
        key: "Suffix"
        initialValue: "{{.Form.Branch}}"
