# ── General ──────────────────────────────────────────────
set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

set-option -g mode-keys vi
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# ── Vi copy mode ─────────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Pane splits (keep cwd) ──────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Pane navigation ─────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resizing ────────────────────────────────────────
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

# ── Reload config ────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Status bar ───────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-style "bg=#15191e,fg=#dbdbdb"

# Left: session name
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#15191e,bold]  #S #[bg=#15191e,fg=#89b4fa] "

# Right: date + clock
set -g status-right-length 80
set -g status-right "#[fg=#585b70]#[bg=#585b70,fg=#dbdbdb]  %a %b %d #[bg=#94e2d5,fg=#585b70]#[bg=#94e2d5,fg=#15191e,bold]  %H:%M:%S "

# ── Window tabs ──────────────────────────────────────────
set -g window-status-format "#[fg=#585b70] #I:#W "
set -g window-status-current-format "#[bg=#353749,fg=#89b4fa,bold]  #I:#W "
set -g window-status-separator ""

# ── Pane borders ─────────────────────────────────────────
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# ── Messages & command line ──────────────────────────────
set -g message-style "bg=#353749,fg=#f5e0dc,bold"
set -g message-command-style "bg=#353749,fg=#94e2d5"

# ── Copy mode highlight ─────────────────────────────────
setw -g mode-style "bg=#353749,fg=#f5c2e7"

# ── Clock ────────────────────────────────────────────────
setw -g clock-mode-colour "#89b4fa"
setw -g clock-mode-style 24
